# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Stabilize KSP for Kotlin 2.0 + AGP 9.x
# Disable KSP2 to avoid the 'unexpected jvm signature V' error
ksp.useKSP2=true
# Allow KSP to find source sets in newer AGP versions
android.experimental.privatize-worker-processes=false
android.disallowKotlinSourceSets=false